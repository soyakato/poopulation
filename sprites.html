<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>POOPULATION SPRITE EDITOR</title><script src="stage-loader.js?v=1"></script>
<style>
:root{--bg:#17120c;--panel:#221a11;--line:#4a3823;--ink:#f2e6cf;--dim:#a49070;--gold:#e8b23c;--green:#7fae2f;--red:#c9452e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic",sans-serif}header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:2px solid var(--line);background:#100c07}h1{font-size:17px;color:var(--gold);margin:0}nav{margin-left:auto;display:flex;gap:9px}a{color:var(--gold)}main{display:grid;grid-template-columns:280px minmax(360px,1fr) minmax(320px,440px);min-height:calc(100vh - 55px)}aside,.work,.json{padding:16px;overflow:auto}aside{background:var(--panel);border-right:2px solid var(--line)}.json{border-left:2px solid var(--line);display:flex;flex-direction:column;gap:10px}h2{font-size:15px;color:var(--gold);margin:16px 0 8px}.lead,.note{color:var(--dim);line-height:1.7;font-size:12px}label{display:flex;flex-direction:column;gap:4px;color:var(--dim);font-size:12px;margin:9px 0}input,select,textarea,button{font:inherit;color:var(--ink);background:#120d08;border:1px solid var(--line);padding:8px}button{cursor:pointer}button:hover,.on{border-color:var(--gold)!important}.primary{background:var(--gold);border-color:var(--gold);color:#22160a}.actions{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.work{display:flex;flex-direction:column;align-items:center;gap:12px;background:#100c07}.canvas-wrap{max-width:100%;overflow:auto;padding:14px;background:repeating-conic-gradient(#251d14 0 25%,#1b150f 0 50%) 50%/16px 16px;border:2px solid var(--line)}#grid{display:block;image-rendering:pixelated;touch-action:none;cursor:crosshair}.preview{display:flex;align-items:center;gap:14px;color:var(--dim);font-size:12px}#preview{image-rendering:pixelated;width:auto;height:104px;border:1px solid var(--line);background:#19130d}.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}.tools input[type=color]{width:52px;height:38px;padding:3px}.json textarea{width:100%;flex:1;min-height:500px;font:11px/1.5 Consolas,monospace}.report{white-space:pre-wrap;padding:9px;border:1px solid var(--line);font-size:12px;color:var(--dim)}.ok{border-color:var(--green);color:#b8d87d}.bad{border-color:var(--red);color:#ff9d8d}iframe{display:none}@media(max-width:1050px){main{grid-template-columns:260px 1fr}.json{grid-column:1/-1;border-left:0;border-top:2px solid var(--line)}.json textarea{min-height:360px}}@media(max-width:700px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:2px solid var(--line)}}
.palette{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;max-width:430px}.swatch{width:30px;height:30px;padding:0;border:2px solid #756044;background:var(--swatch)}.swatch.transparent{background:repeating-conic-gradient(#eee 0 25%,#777 0 50%) 50%/10px 10px}.swatch.selected{outline:2px solid var(--gold);outline-offset:2px}
</style></head>
<body><header><h1>POOPULATION SPRITE EDITOR</h1><nav><a href="tactics.html">ゲーム</a><a href="characters.html">キャラクター</a><a href="stages.html">ステージ</a><a href="STAGES.md">ガイド</a></nav></header>
<main>
<aside><p class="lead">既存の絵を選んで直接描くか、複製して新キャラクター用のIDを作ります。保存した絵だけが内蔵スプライトを上書きします。</p>
  <label>スプライト<select id="spritePick"></select></label>
  <div id="size" class="note">—</div>
  <h2>保存</h2><div class="actions"><button class="primary" id="save">この絵をJSONへ保存</button><button id="remove">上書きを削除</button></div>
  <h2>複製</h2><label>新しいスプライトID<input id="newId" pattern="[a-z0-9_-]+" placeholder="new_gorilla"></label><button id="duplicate">現在の絵を複製</button>
  <p class="note">キャラクター側の <code>sprite</code> に同じIDを指定してください。最大64×64、1枚16色までです。</p>
</aside>
<section class="work"><div class="tools"><input id="color" type="color" value="#e8b23c" aria-label="描画色"><button id="pen" class="on">鉛筆</button><button id="eraser">消しゴム</button><button id="picker">色を取る</button><button id="undo">元に戻す</button></div><div class="note">この絵の配色（透明＋最大15色）</div><div id="palette" class="palette" aria-label="このスプライトの配色"></div><div class="canvas-wrap"><canvas id="grid"></canvas></div><div class="preview"><canvas id="preview"></canvas><span>ゲーム内サイズ<br><b id="currentId">—</b></span></div></section>
<section class="json"><div class="actions"><button class="primary" id="validate">JSONを検証</button><button id="download">sprites.jsonを書き出す</button><button id="importBtn">別のJSONを開く</button><input id="importFile" type="file" accept="application/json,.json" hidden></div><div id="report" class="report">読み込み中…</div><textarea id="source" spellcheck="false"></textarea></section>
</main><iframe id="baseGame" src="tactics.html?noSprites=1" title="内蔵スプライト読込"></iframe>
<script>
(()=>{"use strict";const API=window.POOPULATION_STAGES,$=id=>document.getElementById(id),CELL=16,grid=$("grid"),gg=grid.getContext("2d"),preview=$("preview"),pg=preview.getContext("2d");let data,base={},id="",pixels=[],tool="pen",history=[];
const rgba=(r,g,b,a)=>`#${[r,g,b,a].map(v=>v.toString(16).padStart(2,"0")).join("")}`;
function report(errors){const el=$("report");el.className="report "+(errors.length?"bad":"ok");el.textContent=errors.length?`エラー ${errors.length}件\n${errors.join("\n")}`:"OK — スプライト定義に問題はありません";}
function parse(){try{return JSON.parse($("source").value);}catch(e){report([`JSON構文: ${e.message}`]);return null;}}
function validate(refresh=true){const d=parse();if(!d)return false;const r=API.validateSprites(d);report(r.errors);if(r.ok&&refresh){data=d;paintList();}return r.ok;}
function sync(){ $("source").value=JSON.stringify(data,null,2)+"\n";validate(false);paintList(); }
function decode(s){return s.pixels.map(row=>[...row].map(ch=>s.palette[parseInt(ch,16)]));}
function reduceColors(rows,preferred=""){const counts=new Map(),transparent=rows.some(r=>r.some(c=>c.endsWith("00")));for(const row of rows)for(const c of row)if(!c.endsWith("00"))counts.set(c,(counts.get(c)||0)+1);const max=16-(transparent?1:0),colors=[...counts].sort((a,b)=>b[1]-a[1]).map(x=>x[0]),keep=colors.slice(0,max);if(preferred&&!preferred.endsWith("00")&&!keep.includes(preferred)){if(keep.length<max)keep.push(preferred);else keep[max-1]=preferred;}const rgb=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16)),nearest=c=>{const a=rgb(c);return keep.reduce((best,k)=>{const b=rgb(k),d=a.reduce((n,v,i)=>n+(v-b[i])**2,0);return d<best.d?{c:k,d}:best;},{c:keep[0],d:Infinity}).c;};const out=rows.map(r=>r.map(c=>c.endsWith("00")?"#00000000":keep.includes(c)?c:nearest(c)));return{rows:out,palette:[...(transparent?["#00000000"]:[]),...keep]};}
function encode(){const reduced=reduceColors(pixels,$("color").value+"ff");pixels=reduced.rows;paintPalette();draw();return{width:pixels[0].length,height:pixels.length,palette:reduced.palette,pixels:pixels.map(row=>row.map(c=>reduced.palette.indexOf(c).toString(16)).join(""))};}
function fromCanvas(c){const g=c.getContext("2d"),d=g.getImageData(0,0,c.width,c.height).data,out=[];for(let y=0;y<c.height;y++){const row=[];for(let x=0;x<c.width;x++){const i=(y*c.width+x)*4;row.push(rgba(d[i],d[i+1],d[i+2],d[i+3]));}out.push(row);}return out;}
function paintList(){const box=$("spritePick"),want=id||new URLSearchParams(location.search).get("sprite")||"normal",ids=new Set([...Object.keys(base),...Object.keys(data?.sprites||{})]);box.innerHTML="";[...ids].sort().forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=k+(data.sprites[k]?" ＊":"");box.append(o);});box.value=ids.has(want)?want:[...ids][0];load(box.value);}
function load(next){if(!next)return;id=next;history=[];pixels=reduceColors(data.sprites[id]?decode(data.sprites[id]):base[id].map(r=>[...r])).rows;$("currentId").textContent=id;$("size").textContent=`${pixels[0].length} × ${pixels.length}px${data.sprites[id]?" ／ JSON上書きあり":" ／ 内蔵スプライト"}`;paintPalette();draw();}
function paintPalette(){const colors=reduceColors(pixels).palette,box=$("palette");box.innerHTML="";for(const c of colors){const b=document.createElement("button"),transparent=c.endsWith("00");b.type="button";b.className="swatch"+(transparent?" transparent":"");b.style.setProperty("--swatch",c);b.title=transparent?"透明（消しゴム）":c;b.onclick=()=>{if(transparent)setTool("eraser");else{$("color").value=c.slice(0,7);setTool("pen");}};if(transparent?tool==="eraser":tool==="pen"&&$("color").value===c.slice(0,7))b.classList.add("selected");box.append(b);}}
function draw(){const h=pixels.length,w=pixels[0].length;grid.width=w*CELL;grid.height=h*CELL;gg.imageSmoothingEnabled=false;gg.clearRect(0,0,grid.width,grid.height);for(let y=0;y<h;y++)for(let x=0;x<w;x++){gg.fillStyle=pixels[y][x].endsWith("00")?((x+y)%2?"#211a12":"#30251a"):pixels[y][x];gg.fillRect(x*CELL,y*CELL,CELL,CELL);gg.strokeStyle="#0003";gg.strokeRect(x*CELL+.5,y*CELL+.5,CELL-1,CELL-1);}preview.width=w;preview.height=h;pg.clearRect(0,0,w,h);for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(!pixels[y][x].endsWith("00")){pg.fillStyle=pixels[y][x];pg.fillRect(x,y,1,1);}}
function snapshot(){history.push(pixels.map(r=>[...r]));if(history.length>30)history.shift();}
function edit(e,first=false){const r=grid.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)*pixels[0].length/r.width),y=Math.floor((e.clientY-r.top)*pixels.length/r.height);if(!pixels[y]?.[x])return;if(first)snapshot();if(tool==="picker"){const c=pixels[y][x];if(c.endsWith("00"))setTool("eraser");else{$("color").value=c.slice(0,7);setTool("pen");}return;}pixels[y][x]=tool==="eraser"?"#00000000":$("color").value+"ff";draw();}
function setTool(t){tool=t;for(const k of ["pen","eraser","picker"])$(k).classList.toggle("on",k===t);paintPalette();}
function save(){try{data.sprites[id]=encode();sync();report([]);}catch(e){report([e.message]);}}
function duplicate(){const n=$("newId").value.trim();if(!/^[a-z0-9_-]+$/.test(n))return report(["IDは半角英小文字・数字・_・-だけにしてください"]);if(base[n]||data.sprites[n])return report([`ID ${n} は既にあります`]);try{data.sprites[n]=encode();id=n;sync();}catch(e){report([e.message]);}}
function download(){if(!validate())return;const blob=new Blob([$("source").value],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="sprites.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
grid.onpointerdown=e=>{grid.setPointerCapture(e.pointerId);edit(e,true);};grid.onpointermove=e=>{if(e.buttons)edit(e);};$("spritePick").onchange=e=>load(e.target.value);$("pen").onclick=()=>setTool("pen");$("eraser").onclick=()=>setTool("eraser");$("picker").onclick=()=>setTool("picker");$("undo").onclick=()=>{if(history.length){pixels=history.pop();draw();}};$("save").onclick=save;$("remove").onclick=()=>{delete data.sprites[id];sync();};$("duplicate").onclick=duplicate;$("validate").onclick=()=>validate();$("download").onclick=download;$("importBtn").onclick=()=>$("importFile").click();$("importFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;$("source").value=await f.text();validate();};
Promise.all([fetch("sprites.json",{cache:"no-cache"}).then(r=>r.json()),new Promise((resolve,reject)=>{const f=$("baseGame"),done=()=>{const T=f.contentWindow.POOPTACT;if(!T)return setTimeout(done,50);for(const [k,c] of Object.entries(T.SPR))if(k.startsWith("u_"))base[k.slice(2)]=fromCanvas(c);resolve();};f.onload=done;setTimeout(()=>reject(Error("内蔵スプライトの読込に失敗しました")),10000);})]).then(([d])=>{data=d;sync();}).catch(e=>report([e.message]));})();
</script></body></html>
