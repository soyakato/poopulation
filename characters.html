<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>POOPULATION CHARACTER EDITOR</title><script src="stage-loader.js?v=1"></script>
<style>
:root{--bg:#17120c;--panel:#221a11;--line:#4a3823;--ink:#f2e6cf;--dim:#a49070;--gold:#e8b23c;--green:#7fae2f;--red:#c9452e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic",sans-serif}header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:2px solid var(--line);background:#100c07}h1{font-size:17px;color:var(--gold);margin:0}nav{margin-left:auto;display:flex;gap:9px}a{color:var(--gold)}main{display:grid;grid-template-columns:minmax(360px,480px) 1fr;min-height:calc(100vh - 55px)}aside,.json{padding:16px;overflow:auto}aside{background:var(--panel);border-right:2px solid var(--line)}h2{font-size:15px;color:var(--gold);margin:18px 0 8px}.lead,.note{color:var(--dim);line-height:1.7;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px}.wide{grid-column:1/-1}label{display:flex;flex-direction:column;gap:4px;color:var(--dim);font-size:12px}input,select,textarea,button{font:inherit;color:var(--ink);background:#120d08;border:1px solid var(--line);padding:8px}button{cursor:pointer}button:hover{border-color:var(--gold)}button.primary{background:var(--gold);border-color:var(--gold);color:#22160a}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.json{display:flex;flex-direction:column;gap:10px}.json textarea{width:100%;min-height:620px;flex:1;font:12px/1.55 Consolas,monospace}.report{white-space:pre-wrap;padding:10px;border:1px solid var(--line);color:var(--dim)}.ok{border-color:var(--green);color:#b8d87d}.bad{border-color:var(--red);color:#ff9d8d}@media(max-width:900px){main{grid-template-columns:1fr}aside{border:0;border-bottom:2px solid var(--line)}}
</style></head>
<body><header><h1>POOPULATION CHARACTER EDITOR</h1><nav><a href="tactics.html">ゲーム</a><a href="sprites.html">スプライト</a><a href="stages.html">ステージ</a><a href="studio.html">演出</a><a href="STAGES.md">ガイド</a></nav></header>
<main><aside>
  <p class="lead">既存キャラクターをテンプレートとして複製します。見た目はピクセルエディタで変更でき、スキル・AIは既存挙動を再利用するため、プログラムを書かずに新キャラクターを追加できます。</p>
  <h2>テンプレートから追加</h2>
  <div class="grid">
    <label>陣営<select id="side"><option value="allies">味方</option><option value="enemies">敵</option></select></label><label>元キャラクター<select id="template"></select></label>
    <label>ID（英数字）<input id="id" pattern="[a-z0-9_-]+" placeholder="new_gorilla"></label><label>スプライトID<input id="sprite" pattern="[a-z0-9_-]+"></label>
    <label>日本語名<input id="nameJa"></label><label>英語名<input id="nameEn"></label>
    <label>HP<input id="hp" type="number" min="1"></label><label>攻撃<input id="atk" type="number" min="1"></label>
    <label>素早さ<input id="spd" type="number" min="1"></label><label>移動<input id="move" type="number" min="1"></label>
    <label>ジャンプ<input id="jump" type="number" min="1"></label><label>射程<input id="rng" type="number" min="1"></label>
    <label>防御倍率<input id="def" type="number" min="0.1" step="0.05"></label><label id="mpLabel">最大MP<input id="mp" type="number" min="1"></label>
    <label id="birthColorLabel">出生色<select id="birthColor"><option value="y">黄</option><option value="r">赤</option><option value="b">青</option></select></label><label id="birthWeightLabel">出生比重<input id="birthWeight" type="number" min="1"></label>
  </div>
  <p class="note">固有スキル／AIは元キャラクターから引き継ぎます。絵は <a id="spriteLink" href="sprites.html">SPRITE EDITOR</a> で既存スプライトを編集・複製できます。</p>
  <div class="actions"><button class="primary" id="add">キャラクターを追加</button></div>
</aside>
<section class="json"><div class="actions"><button class="primary" id="validate">JSONを検証</button><button id="download">characters.jsonを書き出す</button><button id="importBtn">別のJSONを開く</button><input id="importFile" type="file" accept="application/json,.json" hidden></div><div id="report" class="report">読み込み中…</div><textarea id="source" spellcheck="false"></textarea></section></main>
<script>
(()=>{"use strict";const API=window.POOPULATION_STAGES,$=id=>document.getElementById(id);let data;const num=id=>$(id).valueAsNumber;
function sync(){$("source").value=JSON.stringify(data,null,2)+"\n";validate(false);paintTemplates();}
function parse(){try{return JSON.parse($("source").value);}catch(e){report([`JSON構文: ${e.message}`]);return null;}}
function report(errors){const el=$("report");el.className="report "+(errors.length?"bad":"ok");el.textContent=errors.length?`エラー ${errors.length}件\n${errors.join("\n")}`:"OK — キャラクター定義に問題はありません";}
function validate(refresh=true){const d=parse();if(!d)return false;const r=API.validateCharacters(d);report(r.errors);if(r.ok&&refresh){data=d;paintTemplates();}return r.ok;}
function paintTemplates(){const side=$("side").value,box=$("template"),old=box.value;box.innerHTML="";(data?.[side]||[]).forEach((c,i)=>{const o=document.createElement("option");o.value=String(i);o.textContent=`${c.id}　${c.name.ja}`;box.append(o)});box.value=old&&data[side][old]?old:"0";paint();}
function paint(){const side=$("side").value,c=data?.[side]?.[Number($("template").value)||0];if(!c)return;$("id").value=c.id+"_new";$("nameJa").value=c.name.ja+"改";$("nameEn").value=c.name.en+" Variant";$("sprite").value=c.sprite;$("spriteLink").href=`sprites.html?sprite=${encodeURIComponent(c.sprite)}`;for(const k of ["hp","atk","spd","move","jump","rng","def"])$(k).value=c.stats[k];$("mp").value=c.stats.mp||10;const ally=side==="allies";$("mpLabel").hidden=!ally;$("birthColorLabel").hidden=!ally;$("birthWeightLabel").hidden=!ally;$("birthColor").value=c.birth?.color||"y";$("birthWeight").value=c.birth?.weight||1;}
function add(){const side=$("side").value,base=data[side][Number($("template").value)||0],id=$("id").value.trim(),sprite=$("sprite").value.trim();if(!/^[a-z0-9_-]+$/.test(id)||!/^[a-z0-9_-]+$/.test(sprite))return report(["IDとスプライトIDは半角英小文字・数字・_・-だけにしてください"]);const c=structuredClone(base);c.id=id;c.sprite=sprite;c.name={ja:$("nameJa").value.trim(),en:$("nameEn").value.trim()};for(const k of ["hp","atk","spd","move","jump","rng","def"])c.stats[k]=num(k);if(side==="allies"){c.stats.mp=num("mp");c.birth={color:$("birthColor").value,weight:num("birthWeight")};c.unlockOrder=Math.max(0,...data.allies.map(x=>x.unlockOrder||0))+1;}data[side].push(c);sync();}
function download(){if(!validate())return;const blob=new Blob([$("source").value],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="characters.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
$("side").onchange=paintTemplates;$("template").onchange=paint;$("sprite").oninput=()=>$("spriteLink").href=`sprites.html?sprite=${encodeURIComponent($("sprite").value)}`;$("add").onclick=add;$("validate").onclick=()=>validate();$("download").onclick=download;$("importBtn").onclick=()=>$("importFile").click();$("importFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;$("source").value=await f.text();validate();};fetch("characters.json",{cache:"no-cache"}).then(r=>r.json()).then(d=>{data=d;sync();}).catch(e=>report([e.message]));})();
</script></body></html>
